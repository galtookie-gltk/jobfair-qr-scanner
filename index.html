<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Job Fair QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    #startBtn {
      background: #1a73e8;
      color: white;
    }
#checkInBtn {
  display: none;
  background: #1a73e8;
  color: white;
}
    #againBtn {
      display: none;
      background: #188038;
      color: white;
    }

    #result {
      display: none;
      background: #e6f4ea;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
    }

    #qrText {
      font-size: 24px;
      font-weight: bold;
      word-break: break-word;
      margin-top: 10px;
    }

    #error {
      display: none;
      background: #fce8e6;
      color: #b3261e;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
    }

    #status {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Job Fair QR Scanner</h2>

  <p>Tap the button to scan an applicant's QR code.</p>

  <button id="startBtn" onclick="startScanner()">
    Start QR Scanner
  </button>

  <div id="status"></div>

  <div id="reader"></div>

  <div id="result">
    <strong>QR CODE RESULT</strong>
    <div id="qrText"></div>
  </div>

  <div id="error"></div>
<button id="checkInBtn" onclick="proceedToCheckIn()">
  PROCEED TO CHECK-IN
</button>
  <button id="againBtn" onclick="scanAgain()">
    Scan Another
  </button>

</div>


<script>

let scanner = null;
let scanned = false;
let scannedRegistrationId = "";


async function startScanner() {

  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");
  const result = document.getElementById("result");

  startBtn.style.display = "none";
  againBtn.style.display = "none";
  errorBox.style.display = "none";
  result.style.display = "none";

  status.textContent = "Requesting camera access...";

  scanned = false;

  try {

    scanner = new Html5Qrcode("reader");

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

     async (decodedText) => {

  if (scanned) return;

  scanned = true;

  scannedRegistrationId =
    String(decodedText || "").trim();

        status.textContent = "QR code detected.";

        try {
          await scanner.stop();
        } catch(e) {
          console.log(e);
        }

        document.getElementById("qrText").textContent =
          decodedText;

      result.style.display = "block";

document.getElementById("checkInBtn").style.display =
  "block";

againBtn.style.display = "block";

        status.textContent = "Scan complete.";

      },

      (scanError) => {
        // Ignore normal scan misses
      }

    );

    status.textContent =
      "Camera active — point it at the QR code.";

  }

  catch(err) {

    console.error(err);

    status.textContent = "";

    let message =
      "Camera could not be started.";

    if (
      err.name === "NotAllowedError" ||
      String(err).toLowerCase().includes("permission")
    ) {

      message =
        "Camera permission was denied. Please allow camera access and try again.";

    }

    else if (err.name === "NotFoundError") {

      message =
        "No camera was found on this device.";

    }

    else if (err.name === "NotReadableError") {

      message =
        "The camera may be in use by another app. Close other camera apps and try again.";

    }

    errorBox.textContent = message;
    errorBox.style.display = "block";

    startBtn.style.display = "block";
  }
}

function proceedToCheckIn() {

  if (!scannedRegistrationId) {
    return;
  }

  const CHECKIN_WEB_APP_URL =
    "https://script.google.com/a/macros/gingoog.gov.ph/s/AKfycbx7Rnbq9L354cBazX1Hc4Pmc-BKGvCYAGbxkHMGxvN6aM4PC3c5vMR8Rw_94Pg3kTV1/exec";

  const destination =
    CHECKIN_WEB_APP_URL +
    "?id=" +
    encodeURIComponent(scannedRegistrationId);

  window.location.href = destination;
}
function scanAgain() {

  document.getElementById("reader").innerHTML = "";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("error").style.display =
    "none";

  document.getElementById("againBtn").style.display =
    "none";

  document.getElementById("startBtn").style.display =
    "block";

  document.getElementById("status").textContent =
    "Ready to scan.";

scanner = null;
scanned = false;
scannedRegistrationId = "";

document.getElementById("checkInBtn").style.display =
  "none";
}

</script>

</body>
</html>
